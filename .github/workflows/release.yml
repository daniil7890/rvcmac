name: Release

# Runs when a release is published and attaches the built app to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build RVCMac.app
        run: bash scripts/build_app.sh --release "${GITHUB_REF_NAME#v}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: .github/release-notes.md
