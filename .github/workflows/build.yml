name: Build

# Compiles the app and runs the unit tests on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: No Xcode-only macros
        # Command Line Tools have no SwiftUI macro plugins, so @State/@Observable/#Preview break local builds
        run: |
          if grep -rnE "^[^/]*(@State |@State$|@Observable|@Bindable|@Entry|#Preview)" app/Sources; then
            echo "::error title=xcode-only macros::these need SwiftUI macro plugins that Command Line Tools do not ship"
            exit 1
          fi

      - name: Build
        working-directory: app
        run: swift build -c release --arch arm64 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Compiler diagnostics as annotations
        if: always()
        working-directory: app
        run: |
          python3 ../scripts/ci_annotate.py build.log error ": error:" "swift errors"
          python3 ../scripts/ci_annotate.py build.log warning ": warning:" "swift warnings"

      - name: Unit tests
        working-directory: app
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Test summary
        if: success()
        working-directory: app
        run: python3 ../scripts/ci_annotate.py test.log notice "Executed [0-9]+ tests" "tests"

      - name: Assemble release-style RVCMac.app
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build_app.sh --release 0.0.0-ci
          plutil -p RVCMac.app/Contents/Info.plist | grep -E "RVCMacPython|CFBundleIconFile"
          test -f RVCMac.app/Contents/Resources/converter/convert.py
          test -f RVCMac.app/Contents/Resources/AppIcon.icns
          echo "::notice title=bundle::$(du -sh RVCMac.app | cut -f1) app, $(plutil -extract RVCMacPythonURL raw RVCMac.app/Contents/Info.plist)"

      - name: Test failures as annotation
        if: failure()
        working-directory: app
        run: python3 ../scripts/ci_annotate.py test.log error "error|failed" "tests"
