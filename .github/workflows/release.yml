name: Release

# Runs when a release is published (or a v* tag is pushed) and attaches the built app.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build RVCMac.app
        run: bash scripts/build_app.sh --release "${GITHUB_REF_NAME#v}"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
