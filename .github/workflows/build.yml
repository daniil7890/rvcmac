name: Build

# Compiles the app and runs the unit tests on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        working-directory: app
        run: swift build -c release --arch arm64 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Compiler diagnostics as annotations
        if: always()
        working-directory: app
        run: |
          python3 ../scripts/ci_annotate.py build.log error ": error:" "swift errors"
          python3 ../scripts/ci_annotate.py build.log warning ": warning:" "swift warnings"

      - name: Unit tests
        working-directory: app
        run: swift test 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Test summary
        if: success()
        working-directory: app
        run: python3 ../scripts/ci_annotate.py test.log notice "Executed [0-9]+ tests" "tests"

      - name: Assemble RVCMac.app
        if: success()
        run: bash scripts/build_app.sh

      - name: Test failures as annotation
        if: failure()
        working-directory: app
        run: python3 ../scripts/ci_annotate.py test.log error "error|failed" "tests"
